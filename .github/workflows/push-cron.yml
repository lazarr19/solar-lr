name: Push notification cron

on:
  schedule:
    - cron: '10 * * * *'
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger push cron
        run: |
          curl -sf -X GET "${{ secrets.APP_URL }}/api/push/cron" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
